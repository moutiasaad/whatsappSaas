; wavadesk Reverb WebSocket server -> 127.0.0.1:8080
; install to /etc/supervisor/conf.d/reverb.conf
; Replace __APP_PATH__.

[program:wavadesk-reverb]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php __APP_PATH__/artisan reverb:start --host=0.0.0.0 --port=8080
directory=__APP_PATH__
user=www
numprocs=1
autostart=true
autorestart=true
stopwaitsecs=10
stopsignal=QUIT
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=__APP_PATH__/storage/logs/reverb.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5

[group:wavadesk-reverb]
programs=wavadesk-reverb
priority=998
