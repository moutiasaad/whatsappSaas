# Laravel Reverb WebSocket reverse proxy -> 127.0.0.1:8080
# Drop into the directory the app vhost pulls in with IncludeOptional, for both
# the :80 and :443 vhosts. On aaPanel that is:
#   /www/server/panel/vhost/apache/proxy/<domain>/reverb.conf
# Requires: a2enmod proxy proxy_http proxy_wstunnel rewrite
<IfModule mod_proxy.c>
    ProxyPreserveHost On
    ProxyRequests Off
    RewriteEngine On

    # WebSocket upgrade to /app/<key> -> ws tunnel (mod_proxy_wstunnel)
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/?app/(.*)$ "ws://127.0.0.1:8080/app/$1" [P,L]

    # Non-upgrade hits to /app -> plain http to Reverb
    RewriteCond %{HTTP:Upgrade} !=websocket [NC]
    RewriteRule ^/?app/(.*)$ "http://127.0.0.1:8080/app/$1" [P,L]

    # Broadcast egress API (pusher-php-server -> Reverb)
    ProxyPass        /apps http://127.0.0.1:8080/apps
    ProxyPassReverse /apps http://127.0.0.1:8080/apps
</IfModule>
