; wavadesk — queue workers + scheduler
; install to /etc/supervisor/conf.d/wavadesk.conf  then:
;   supervisorctl reread && supervisorctl update
; Replace __APP_PATH__ with the install path (default /www/wwwroot/public/wavadesk.com).

[program:wavadesk-whatsapp]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php __APP_PATH__/artisan queue:work database --queue=whatsapp --sleep=1 --tries=3 --max-time=3600 --memory=256
directory=__APP_PATH__
user=www
numprocs=2
autostart=true
autorestart=true
stopwaitsecs=60
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/wavadesk-whatsapp.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5

[program:wavadesk-default]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php __APP_PATH__/artisan queue:work database --queue=default --sleep=3 --tries=3 --max-time=3600 --memory=256
directory=__APP_PATH__
user=www
numprocs=1
autostart=true
autorestart=true
stopwaitsecs=60
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/wavadesk-default.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5

; The source server has NO scheduler running for wavadesk — this program closes
; that gap. Anything registered in routes/console.php or bootstrap/app.php's
; withSchedule() has never fired in production until now.
[program:wavadesk-scheduler]
command=/usr/bin/php __APP_PATH__/artisan schedule:work
directory=__APP_PATH__
user=www
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/wavadesk-scheduler.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5

[group:wavadesk]
programs=wavadesk-whatsapp,wavadesk-default,wavadesk-scheduler
priority=999
