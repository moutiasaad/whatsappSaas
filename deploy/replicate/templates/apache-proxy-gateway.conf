# WhatsApp gateway vhost proxy -> 127.0.0.1:8084
# This is the whole vhost body for the gateway subdomain (xapi-*). It has no
# document root of its own; everything is proxied to the node process.
<IfModule mod_proxy.c>
    ProxyRequests Off
    SSLProxyEngine on
    ProxyPass / http://127.0.0.1:8084/
    ProxyPassReverse / http://127.0.0.1:8084/
</IfModule>
