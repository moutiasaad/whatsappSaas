; WhatsApp gateway (code-chat-br/whatsapp-api fork) -> 127.0.0.1:8084
;
; The SOURCE server runs this under pm2 (`npm run start:prod`, PM2 God Daemon
; in /root/.pm2). Supervisor is recommended instead: everything else on the box
; is already supervised, and pm2's `resurrect` after a reboot is easy to forget.
; Pick ONE — running both double-binds port 8084.
;
; install to /etc/supervisor/conf.d/wavadesk-gateway.conf  and replace __GW_PATH__.
; NOTE: command is `node dist/src/main.js`, NOT start.sh — start.sh rebuilds
; (rm -rf dist && npm run build) on every start, which under an autorestart
; supervisor turns a crash loop into a rebuild loop.

[program:wavadesk-gateway]
command=/usr/local/bin/node dist/src/main.js
directory=__GW_PATH__
user=www
environment=NODE_ENV="production",HOME="/home/www"
autostart=true
autorestart=true
startsecs=10
stopwaitsecs=20
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/wavadesk-gateway.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
