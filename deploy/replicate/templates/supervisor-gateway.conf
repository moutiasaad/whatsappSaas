; WhatsApp gateway (code-chat-br/whatsapp-api fork) -> 127.0.0.1:8084
;
; The SOURCE server runs this under NOTHING: a bare detached `bash start.sh`
; orphaned to init, with no restart on crash or reboot. (/root/.pm2 and a stale
; PM2 God Daemon exist, but the pm2 CLI is not on PATH and does not own :8084.)
; Supervisor is the fix: everything else on the box is already supervised.
; Pick ONE — running both double-binds port 8084.
;
; install to /etc/supervisor/conf.d/wavadesk-gateway.conf  and replace __GW_PATH__.
; NOTE: command is `node dist/src/main.js`, NOT start.sh — start.sh rebuilds
; (rm -rf dist && npm run build) on every start, which under an autorestart
; supervisor turns a crash loop into a rebuild loop.

[program:wavadesk-gateway]
; NOTE: node path differs by install method — /usr/local/bin/node on the source
; (tarball install), /usr/bin/node from NodeSource apt. Check `command -v node`
; and substitute; supervisor gives a bare "no such file" if it is wrong.
command=__NODE_BIN__ dist/src/main.js
directory=__GW_PATH__
user=www
environment=NODE_ENV="production",HOME="/home/www"
autostart=true
autorestart=true
startsecs=10
stopwaitsecs=20
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/wavadesk-gateway.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
