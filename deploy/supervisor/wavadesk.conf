; Supervisor configuration for wavadesk.com
; Copy to: /etc/supervisor/conf.d/wavadesk.conf
; Then run:  supervisorctl reread && supervisorctl update && supervisorctl start wavadesk:*

; ─────────────────────────────────────────────────
; WhatsApp queue worker (high priority)
; Processes incoming messages, AI replies, outgoing sends
; ─────────────────────────────────────────────────
[program:wavadesk-whatsapp]
process_name=%(program_name)s_%(process_num)02d
command=php /www/wwwroot/public/wavadesk.com/artisan queue:work database --queue=whatsapp --sleep=1 --tries=3 --max-time=3600 --memory=256
directory=/www/wwwroot/public/wavadesk.com
user=www-data
numprocs=2
autostart=true
autorestart=true
stopwaitsecs=60
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/wavadesk-whatsapp.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5

; ─────────────────────────────────────────────────
; Default queue worker (general jobs)
; ─────────────────────────────────────────────────
[program:wavadesk-default]
process_name=%(program_name)s_%(process_num)02d
command=php /www/wwwroot/public/wavadesk.com/artisan queue:work database --queue=default --sleep=3 --tries=3 --max-time=3600 --memory=256
directory=/www/wwwroot/public/wavadesk.com
user=www-data
numprocs=1
autostart=true
autorestart=true
stopwaitsecs=60
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/wavadesk-default.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5

; ─────────────────────────────────────────────────
; Group — start/stop all workers at once
; ─────────────────────────────────────────────────
[group:wavadesk]
programs=wavadesk-whatsapp,wavadesk-default
priority=999
